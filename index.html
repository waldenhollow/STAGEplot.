<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Interactive 3D stage plot builder for bands, FOH and monitor techs: band, backline, inputs, monitor mixes, patch bay and playback rigs.">
<meta name="theme-color" content="#0e1013">
</head>
<body>
<title>Stage Plot Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage on the left, a road-case style patch panel on the right (bottom sheet on phones). Single dark look: a stage at show-dark. */
:root{
  --bg:#0c0e11; --panel:#13161b; --raise:#1a1e25; --field:#0f1215; --line:#272d36; --fg:#ece8df; --muted:#8e95a0;
  --accent:#ffd166; --accent-ink:#1d1606; --danger:#ff7a6b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%}
.viewer{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0a0c0f}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c.walk{cursor:crosshair}
#c.drag{cursor:move}

.hud{position:absolute;z-index:5;display:flex;gap:8px;align-items:center}
.hud-top{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:12px;flex-wrap:wrap}
.seg{display:flex;background:rgba(12,14,17,.85);border:1px solid var(--line);border-radius:8px;padding:3px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.jumps{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none;padding:2px}
.jumps::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(12,14,17,.85);padding:6px 10px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px)}
.chip:hover{border-color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.hud-bl{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:flex-start}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:rgba(12,14,17,.85);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tog::before{content:"";width:8px;height:8px;border-radius:2px;border:1px solid var(--muted)}
.tog[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.legend{display:flex;gap:10px;flex-wrap:wrap;background:rgba(12,14,17,.85);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:block}
.hint{position:absolute;z-index:5;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(12,14,17,.85);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--muted);max-width:min(340px,60%);text-align:right}
.hint kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg)}
.hint b{color:var(--accent);font-weight:600}
.empty3d{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(12,14,17,.85);border:1px dashed var(--muted);border-radius:10px;padding:16px 20px;max-width:300px;color:var(--muted);line-height:1.45}
.empty3d b{display:block;color:var(--fg);font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}

.tags{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-family:var(--f-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;padding:2px 8px;border-radius:4px;will-change:transform}
.tag.member{background:var(--c);color:#0b0b0b}
.tag.member::after{content:"";position:absolute;left:50%;bottom:-5px;width:2px;height:5px;background:var(--c);transform:translateX(-50%)}
.tag.tour{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,209,102,.55);background:rgba(12,14,17,.78);color:var(--accent);font-size:12px}
.tag.tour:hover{background:var(--accent);color:var(--accent-ink)}
.tag.sel{background:var(--accent);color:var(--accent-ink);font-size:14px;padding:3px 10px;box-shadow:0 4px 18px rgba(0,0,0,.5)}

.addbar{position:absolute;z-index:6;right:12px;top:calc(56px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.addbar button{border:1px solid var(--accent);background:rgba(12,14,17,.9);color:var(--accent);border-radius:7px;padding:7px 12px;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tag.snap{background:#5fd0c2;color:#071816;font-size:13px;padding:3px 9px}
.qbtn{border:1px solid var(--line);background:rgba(12,14,17,.85);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--accent)}
.rotbar{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;align-items:center;background:rgba(12,14,17,.9);border:1px solid var(--accent);border-radius:8px;padding:4px 6px;font-size:12px}
.rotbar span{color:var(--muted);padding:0 4px;font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.rotbar button{border:1px solid var(--line);background:var(--raise);border-radius:5px;padding:6px 8px;cursor:pointer;font-size:12px;white-space:nowrap}
.rotbar button:hover{border-color:var(--accent)}
.joy{position:absolute;z-index:6;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;border:1px solid var(--line);background:rgba(12,14,17,.55);touch-action:none}
.joy b{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--accent);opacity:.85}

aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.ph{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.phrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow .ex{border:1px dashed var(--muted);border-radius:3px;padding:0 5px;letter-spacing:.08em}
.eyebrow .saved{letter-spacing:.02em;text-transform:none;font-family:var(--f-body);font-size:11.5px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px;font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font-family:var(--f-mono);font-size:16px}
.stats b.bad{color:var(--danger)}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg.small button{font-size:13px;padding:5px 10px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:6px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:none}
.btn.danger{color:var(--danger);border-color:#4a2622;background:none}
.btn.plus{width:34px;padding:6px 0;font-weight:700}

.detail{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--raise);min-height:112px}
.detail .k{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.detail .k i{width:10px;height:10px;border-radius:2px;display:block}
.detail h2{margin:4px 0 2px;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.detail p{margin:4px 0 0;color:var(--muted);line-height:1.45;max-width:60ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.route{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11.5px}
.route span{border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:var(--panel)}
.route em{font-style:normal;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer}
.links button:hover{border-color:var(--accent);color:var(--accent)}
.warn{margin-top:10px;font-size:12.5px;color:var(--accent);display:flex;gap:6px}
.detail .empty{color:var(--muted);line-height:1.5}

.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 10px}
.tabs button{flex:1;border:0;background:none;padding:11px 4px 9px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs small{font-family:var(--f-mono);font-size:10.5px;margin-left:4px;opacity:.7}
.list{overflow-y:auto;min-height:0;flex:1;padding:6px 8px 18px}
.grp{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid transparent;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--raise)}
.row.on{background:var(--raise);border-color:var(--accent)}
.row .nm{min-width:0}
.row .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .nm small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{font-family:var(--f-mono);font-weight:700;font-size:13px;min-width:30px;text-align:center;padding:3px;border-radius:4px;background:#0b0d10;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.sw{width:12px;height:30px;border-radius:3px;background:var(--c)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:block}
.badges{display:flex;gap:4px;align-items:center}
.badge{font-family:var(--f-mono);font-size:10px;padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.badge.p48{color:#ff8a7a;border-color:#5a2a26}
.badge.pb{color:#5fd0c2;border-color:#1f4a45}
.badge.mon{color:var(--accent);border-color:#5a4a1f}
.right{color:var(--muted);font-size:12px;text-align:right}
.none{color:var(--muted);padding:18px 10px;line-height:1.5}

.build{display:grid;gap:8px;padding:4px 2px}
.sec{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.sec>summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"+";margin-left:auto;color:var(--muted);font-family:var(--f-mono)}
.sec[open]>summary::after{content:"–"}
.sec>summary small{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.body{padding:0 12px 12px;display:grid;gap:10px}
.f{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;align-items:center}
.f label,.lbl{color:var(--muted);font-size:12.5px}
.f output{font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.rng{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:8px;align-items:center}
select,input[type=text],textarea{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:13px}
textarea{font-family:var(--f-mono);font-size:11.5px;min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addrow select{flex:1;min-width:140px}
.card{border:1px solid var(--line);border-radius:7px;background:var(--raise)}
.card>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px}
.card>summary::-webkit-details-marker{display:none}
.card>summary .nm{min-width:0}
.card>summary .nm div{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card>summary .nm small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card[open]{border-color:var(--accent)}
.card .body{padding:2px 10px 12px}
.sub2{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.mic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.mic .two{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mic .twoc{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.mic .full{grid-column:1/-1}
.mic .top{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px}
.patch{position:fixed;inset:0;z-index:50;background:#0b0d10;display:flex;flex-direction:column}
.patch>header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.patch h2{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.pbhint{color:var(--muted);font-size:12.5px;flex:1;min-width:220px}
.pbtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbsum{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:6px}
.pbwrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(circle at 20% 10%,#161a20,#0b0d10 70%)}
.pbstage{position:relative;display:flex;gap:140px;padding:24px 300px 80px 28px;align-items:flex-start;width:max-content}
#pbsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:2}
.pbcol{display:grid;gap:26px;position:relative;z-index:1}
.pbcol.src{width:240px}
.pbdev{background:linear-gradient(#2a2d33,#1c1e23);border:1px solid #363b44;border-radius:4px;padding:10px 46px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);position:relative}
.pbdev::before,.pbdev::after{content:"";position:absolute;top:0;bottom:0;width:30px;background:repeating-linear-gradient(#3a3e46 0 18px,#2c2f35 18px 20px);border-right:1px solid #444}
.pbdev::before{left:0;border-radius:4px 0 0 4px}.pbdev::after{right:0;border-right:0;border-left:1px solid #444;border-radius:0 4px 4px 0}
.pbdev.k-src{padding:10px 12px 12px}.pbdev.k-src::before,.pbdev.k-src::after{display:none}
.pbdev header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.pbdev header b{font-family:var(--f-display);font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.pbdev header small{color:var(--muted);font-size:12px}
.pbdev header .pbrm{margin-left:auto;padding:3px 10px;font-size:12px;min-height:0}
.pbdev.focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,209,102,.35),0 8px 24px rgba(0,0,0,.45)}
.pbg{margin-top:8px}
.pbgn{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.pbrow{display:flex;gap:30px;align-items:flex-start;margin-top:14px}.pbrow:first-of-type{margin-top:6px}
.pbblk{min-width:0}
.pbjacks{display:grid;gap:8px 6px}
.pbdev.dim{opacity:.55}.pbdev header{cursor:pointer}
.jk.j-combo i::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#000 0 4px,#6b6f76 4.5px 5.5px,transparent 6px),radial-gradient(circle at 35% 34%,#4a4d52 0 1.8px,transparent 2.3px),radial-gradient(circle at 65% 34%,#4a4d52 0 1.8px,transparent 2.3px),radial-gradient(circle at 50% 75%,#4a4d52 0 1.8px,transparent 2.3px)}
.jk.j-trs i{width:24px;height:24px;margin:3px;background:radial-gradient(circle,#000 0 34%,#c9ccd1 38% 58%,#3c4047 62%)}
.jk{width:38px;display:grid;justify-items:center;gap:3px;border:0;background:none;padding:0;cursor:grab;touch-action:none;color:#aab0b9;font:600 10px var(--f-mono)}
.jk i{width:30px;height:30px;border-radius:50%;position:relative;display:block;background:radial-gradient(circle,#060606 0 52%,#9a9ea5 54% 64%,#3c4047 66%);box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06)}
.jk.j-f i::after,.jk.j-m i::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 37% 40%,var(--pin) 0 2px,transparent 2.6px),radial-gradient(circle at 63% 40%,var(--pin) 0 2px,transparent 2.6px),radial-gradient(circle at 50% 66%,var(--pin) 0 2px,transparent 2.6px)}
.jk.j-f{--pin:#4a4d52}.jk.j-m{--pin:#d9dce1}
.jk.j-net i{border-radius:6px;background:linear-gradient(#5a5e66,#2a2d33);}
.jk.j-net i::after{content:"";position:absolute;inset:8px 6px;background:#0a0a0a;border-radius:2px}
.jk.on i{box-shadow:0 0 0 2px var(--c,#9aa3ad),0 0 10px var(--c,#9aa3ad)}
.jk.armed i{box-shadow:0 0 0 3px var(--accent),0 0 14px var(--accent)}
.jk:hover i,.jk.hot i{outline:2px solid rgba(255,209,102,.7);outline-offset:1px}
.k-src .pbjacks{grid-template-columns:1fr;gap:4px}
.k-src .jk{width:100%;grid-template-columns:8px minmax(0,1fr) 28px;justify-items:start;align-items:center;gap:8px;font:500 12px var(--f-body);color:var(--fg);padding:3px 4px 3px 6px;border-radius:5px;background:rgba(255,255,255,.035)}
.k-src .jk b{width:8px;height:20px;border-radius:2px;background:var(--c)}
.k-src .jk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.k-src .jk i{width:26px;height:26px;--pin:#d9dce1}

canvas.addEventListener('pointermove',e=>{if(dragging){const r=canvas.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);if(!ray.ray.intersectPlane(plane,hitP))return;
    const nw=hitP.clone().sub(dragging.off);const lp=dragging.obj.parent.worldToLocal(nw.clone());dragging.obj.position.x=lp.x;dragging.obj.position.z=lp.z;dragging.moved=true;
    dragging.links.forEach((l,i)=>{l.position.x=dragging.link0[i].x+(nw.x-dragging.wp0.x);l.position.z=dragging.link0[i].z+(nw.z-dragging.wp0.z);});
    if(dragging.snaps){const wp=dragging.obj.getWorldPosition(V());let best=null,bd=1e9;dragging.snaps.forEach(t=>{const dd=Math.hypot(t.pos.x-wp.x,t.pos.z-wp.z);if(dd<t.r&&dd<bd){bd=dd;best=t;}});if(best!==dragging.snap){dragging.snap=best;snapHL(best);}}return;}
  if(!down||!drag||tween)return;const dx=e.clientX-down.lx,dy=e.clientY-down.ly;down.lx=e.clientX;down.ly=e.clientY;yaw+=dx*.0042;pitch=clamp(pitch+dy*.0042,-1.25,1.25);});
function endPointer(e){if(dragging){const g=dragging;dragging=null;controls.enabled=mode==='orbit';canvas.classList.remove('drag');snapHL(null);
    const moved=down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>=6;if(g.moved&&moved){commitDrag(g);down=null;return;}
    g.links.forEach((l,i)=>l.position.copy(g.link0[i]));g.obj.position.copy(g.obj.parent.worldToLocal(g.wp0.clone()));}
  if(!down)return;if(e.type==='pointerup'){const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(moved<6&&performance.now()-down.t<500)pick(e);}down=null;drag=false;}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
function commitDrag(g){const P=S.P,d=g.d,wp=g.obj.getWorldPosition(V());
  if(d.k==='member'){const m=P.members.find(x=>x.id===d.m);if(!m)return;const ox=m.x,oz=m.z;[m.x,m.z]=deckClamp(wp.x,wp.z,.3);const dx=m.x-ox,dz=m.z-oz;P.risers.filter(r=>r.link===m.id).forEach(r=>{r.x+=dx;r.z+=dz;});P.racks.filter(r=>r.owner===m.id).forEach(r=>{r.x+=dx;r.z+=dz;});if(P.playback.op===m.id){P.playback.x+=dx;P.playback.z+=dz;}}
  else if(d.k==='amp'){const m=P.members.find(x=>x.id===d.m);if(!m)return;const [x,z]=deckClamp(wp.x,wp.z,.2);m.ampOff=[x-m.x,z-m.z];}
  else if(d.k==='wedge'){const m=P.members.find(x=>x.id===d.m);if(!m)return;const n=m.mon.wedges;const def=m.type==='drums'?[[1.35,.3],[-1.35,.3]]:n===1?[[0,1.25]]:[[-.45,1.25],[.45,1.25]];m.wedgeOff=(m.wedgeOff||def).slice(0,n);while(m.wedgeOff.length<n)m.wedgeOff.push(def[m.wedgeOff.length]);const [x,z]=deckClamp(wp.x,wp.z,.2);m.wedgeOff[d.j]=[x-m.x,z-m.z];}
  else if(d.k==='riser'){const r=P.risers.find(x=>x.id===d.id);if(!r)return;const [x,z]=deckClamp(wp.x,wp.z,.3);const dx=x-r.x,dz=z-r.z;r.x=x;r.z=z;if(r.link){const m=P.members.find(q=>q.id===r.link);if(m){m.x+=dx;m.z+=dz;}}}
  else if(d.k==='sb'){const b=P.stageboxes.find(x=>x.id===d.id);if(b)[b.x,b.z]=deckClamp(wp.x,wp.z,.3);}
  else if(d.k==='rack'){const r=P.racks.find(x=>x.id===d.id);if(r)[r.x,r.z]=deckClamp(wp.x,wp.z,.35);}
  else if(d.k==='part'){const m=P.members.find(x=>x.id===d.m);if(!m)return;const [x,z]=deckClamp(wp.x,wp.z,.15);m.offs=m.offs||{};m.offs[d.part]=[x-m.x,z-m.z];}
  else if(d.k==='fx'){const f=P.fx.find(x=>x.id===d.id);if(f)[f.x,f.z]=deckClamp(wp.x,wp.z,.2);}
  else if(d.k==='kmic'){const m=P.members.find(x=>x.id===d.m);const kit=m&&reg[m.id+'.kit'];const inp=m&&m.inputs[d.j];if(!kit||!inp)return;const lp=kit.worldToLocal(wp.clone());
    const sn=g.snap;if(sn&&sn.type==='kit'&&'kit.'+sn.pid!==inp.role){inp.role='kit.'+sn.pid;delete inp.pos;delete inp.ang;const c=sn.c;if(inp.stand==='Clip-on')inp.ang=Math.atan2(lp.z-c.z,lp.x-c.x);else if(inp.stand!=='Inside kick')inp.pos=[+lp.x.toFixed(3),+lp.z.toFixed(3)];toast('Moved to '+sn.label);}
    else if(d.clip){inp.ang=Math.atan2(lp.z-d.c[1],lp.x-d.c[0]);}else inp.pos=[+lp.x.toFixed(3),+lp.z.toFixed(3)];}
  else if(d.k==='pb'){[P.playback.x,P.playback.z]=deckClamp(wp.x,wp.z,.4);}
  else if(d.k==='pos'){const [x,z]=venueClamp(wp.x,wp.z);P.pos=P.pos||{};const o=P.pos[d.key]||[];P.pos[d.key]=[+x.toFixed(3),+z.toFixed(3),o[2]!=null?o[2]:deg(g.obj.rotation.y)];}
  else if(d.k==='loose'){if(commitLoose(g,wp))return;const lm=P.mics.find(x=>x.id===d.id);if(lm)[lm.x,lm.z]=deckClamp(wp.x,wp.z,.15);}
  P.example=false;changed(false);}
function pick(e){const hits=castAt(e);
  for(const h of hits){const o=h.object;if(o.parent===cableGroup&&!cableGroup.visible)continue;
    if(o.userData.tour!==undefined){if(!showLabels)continue;goTour(o.userData.tour);return;}
    if(o.userData.cable){const id=o.userData.cable,c=cables[id];if(id.startsWith('in.'))select('in',id.slice(3),{fromScene:true});else if(id.startsWith('mon.')){const x=MIXES.find(x=>x.cables.includes(id));if(x)select('mix',x.n,{fromScene:true});}else if(id.startsWith('net.'))select('mix','PM',{fromScene:true});else if(id.startsWith('inst.')&&MEM[id.split('.')[1]])select('m',id.split('.')[1],{fromScene:true});else select('g',c.ends[0],{fromScene:true});return;}
    let n=o;while(n&&!n.userData.id&&!n.userData.floor)n=n.parent;
    if(n&&n.userData.id){const id=n.userData.id;if(MEM[id])select('m',id,{fromScene:true});else select('g',id,{fromScene:true});return;}
    if(o.userData.floor){if(mode==='walk'){walkTo=V(h.point.x,0,h.point.z);curJump=null;markJumps();}else deselect();return;}}
  deselect();}
const joy=$('#joy'),knob=joy.querySelector('b');let jv={x:0,y:0},jid=null;
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jmove(e);});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e);});
const jend=()=>{jid=null;jv={x:0,y:0};knob.style.transform='';};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
function jmove(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}jv={x,y};knob.style.transform=`translate(${x*34}px,${y*34}px)`;walkTo=null;}

function resize(){const w=viewer.clientWidth,h=viewer.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();if(composer){composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(Math.max(1,w),Math.max(1,h));}}
new ResizeObserver(resize).observe(viewer);resize();
const clock=new THREE.Clock();const fwd=V(),rgt=V(),tmp=V(),tmp2=V();
function tick(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(tween){tween.t+=dt/tween.d;const k=ease(Math.min(1,tween.t));camera.position.lerpVectors(tween.p0,tween.p1,k);tmp.lerpVectors(tween.l0,tween.l1,k);camera.lookAt(tmp);lookNow.copy(tmp);if(mode==='orbit')controls.target.copy(tmp);if(tween.t>=1)finishTween();}
  else if(mode==='walk'){let f=0,s=0;if(keys.has('w')||keys.has('arrowup'))f+=1;if(keys.has('s')||keys.has('arrowdown'))f-=1;if(keys.has('d'))s+=1;if(keys.has('a'))s-=1;if(keys.has('arrowleft'))yaw+=dt*1.6;if(keys.has('arrowright'))yaw-=dt*1.6;
    f-=jv.y;s+=jv.x;const sp=(keys.has('shift')?5:2.4)*dt;fwd.set(-Math.sin(yaw),0,-Math.cos(yaw));rgt.set(Math.cos(yaw),0,-Math.sin(yaw));
    if(walkTo){tmp.set(walkTo.x-camera.position.x,0,walkTo.z-camera.position.z);const L=tmp.length();if(L<.08)walkTo=null;else camera.position.addScaledVector(tmp.normalize(),Math.min(L,2.6*dt));}
    camera.position.addScaledVector(fwd,f*sp).addScaledVector(rgt,s*sp);const st=S.P.stage;
    camera.position.x=clamp(camera.position.x,-(st.w/2+st.wing+8),st.w/2+st.wing+8);camera.position.z=clamp(camera.position.z,-st.d/2+.1,st.d/2+20);
    if((f||s)&&eye<1.5)eye=1.62;const ty=floorAt(camera.position.x,camera.position.z)+eye;camera.position.y+=(ty-camera.position.y)*Math.min(1,dt*8);
    camera.lookAt(tmp.copy(camera.position).add(dirFromYP()));lookNow.copy(tmp);}
  else{controls.update();lookNow.copy(controls.target);}
  S.P.members.forEach(m=>{const pr=pplRoot[m.id],rt=RT[m.id];if(!pr||!rt)return;rt.mg.localToWorld(tmp2.copy(rt.head));pr.visible=!(mode==='walk'&&Math.hypot(tmp2.x-camera.position.x,tmp2.z-camera.position.z)<.55);});
  if(hlMats.length){const p=.45+.35*Math.sin(t*4.2);hlMats.forEach(m=>{m.emissive.copy(ACCENT);m.emissiveIntensity=p;});}
  hlCables.forEach(c=>{c.mesh.material.emissiveIntensity=.9+.5*Math.sin(t*4.2);});
  if(selRing.visible)selRing.scale.setScalar(selRing.userData.base*(1+.06*Math.sin(t*3)));
  tourRings.forEach((r,i)=>{r.material.opacity=.45+.3*Math.sin(t*2+i);});
  if(showBeams&&FXA.length&&!reduce)stepFX(dt,t);
  if(composer){finalPass.uniforms.t.value=t%10;composer.render(dt);}else renderer.render(scene,camera);updateTags();requestAnimationFrame(tick);}

let boot=null;try{boot=migrate(JSON.parse(LS.get('stageplot.current')||'null'));}catch(e){}
S.P=boot||examplePlot();
try{rebuild();}catch(e){console.error(e);S.P=examplePlot();rebuild();}

homeFor(S.P.stage);camera.position.copy(HOME.pos);camera.lookAt(HOME.look);controls.target.copy(HOME.look);lookNow.copy(HOME.look);
tick();
(async()=>{try{if(!window.claude||!claude.use)return;const [d,u,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);downloads=dl;
  if(d&&u){const id=await u.id();if(id){db=d;uid=id;S.backend='db';const w=$('#saveWhere');if(w)w.textContent='Plots save to your account automatically.';await refreshPlots();
    if(!boot&&S.plots.length)openPlot(S.plots[0].id);}}}catch(e){}})();
})();
